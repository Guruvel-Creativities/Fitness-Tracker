<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitness Tracker</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
body { font-family: Arial; background:#f5f5f5; }
.container { max-width:1200px; margin:auto; }
#map { height:500px; margin-top:20px; border-radius:10px; }
#debug { background:#111; color:#0f0; padding:10px; height:150px; overflow:auto; font-size:12px;}
button { padding:10px; margin:5px; }
</style>
</head>

<body>

<div class="container">
<h2>Fitness Tracker</h2>

<input type="date" id="dateInput">
<button onclick="fetchSheetData()">Load Route</button>

<div id="map"></div>
<div id="debug">> Ready...<br></div>
</div>

<script>

// ================= SETTINGS =================
// ✅ YOUR SHEET DETAILS
const SHEET_ID = '1_fubpXNN3EzGVCgGrT8QCJFdXBMb-vrBDs1qyWXL2no';
const GID = '1576719619';

// ✅ CORRECT CSV URL (FIXED)
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}&t=${Date.now()}`;

// ================= GLOBAL =================
let map, routeLine, startMarker, endMarker;

// ================= LOGGER =================
function log(msg){
    const d = document.getElementById("debug");
    d.innerHTML += "> " + msg + "<br>";
    d.scrollTop = d.scrollHeight;
    console.log(msg);
}

// ================= MAP =================
function initMap(){
    map = L.map('map').setView([11.0168, 76.9558], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
        attribution:'© OpenStreetMap'
    }).addTo(map);
}

// ================= FETCH =================
async function fetchSheetData(){

    const filterDate = document.getElementById("dateInput").value;
    if(!filterDate){
        alert("Select date first");
        return;
    }

    log("Fetching CSV...");

    try{
        const res = await fetch(CSV_URL);

        if(!res.ok){
            throw new Error("Sheet not accessible (Check sharing settings)");
        }

        const text = await res.text();

        Papa.parse(text,{
            header:true,
            skipEmptyLines:true,
            complete:(result)=>{
                processData(result.data, filterDate);
            }
        });

    }catch(e){
        log("ERROR: " + e.message);
    }
}

// ================= PROCESS =================
function processData(data, filterDate){

    if(!data || data.length === 0){
        log("No data found");
        return;
    }

    log("Total rows: " + data.length);
    log("Columns: " + Object.keys(data[0]).join(", "));

    // ✅ FIXED COLUMN NAMES (MATCH YOUR SHEET)
    const latKey = "Latitude";
    const lonKey = "Longitude";
    const dateKey = "Date";
    const timeKey = "Time";

    // ✅ DATE FILTER (SAFE)
    const filtered = data.filter(row=>{
        return String(row[dateKey]).trim() === filterDate;
    });

    log("Filtered rows: " + filtered.length);

    if(filtered.length === 0){
        alert("No data for selected date");
        return;
    }

    renderRoute(filtered, latKey, lonKey);
}

// ================= RENDER =================
function renderRoute(data, latK, lonK){

    let points = [];

    data.forEach(row=>{
        const lat = Number(row[latK]);
        const lon = Number(row[lonK]);

        if(!isNaN(lat) && !isNaN(lon)){
            points.push([lat, lon]);
        }
    });

    log("Valid points: " + points.length);

    // CLEAR OLD
    if(routeLine) map.removeLayer(routeLine);
    if(startMarker) map.removeLayer(startMarker);
    if(endMarker) map.removeLayer(endMarker);

    if(points.length === 0){
        log("No valid GPS points");
        return;
    }

    // DRAW ROUTE
    routeLine = L.polyline(points,{
        color:"blue",
        weight:5
    }).addTo(map);

    // START & END MARKERS
    startMarker = L.marker(points[0]).addTo(map).bindPopup("Start");
    endMarker = L.marker(points[points.length-1]).addTo(map).bindPopup("End");

    map.fitBounds(routeLine.getBounds(), {padding:[50,50]});

    // FIX MAP DISPLAY BUG
    setTimeout(()=>map.invalidateSize(),500);

    log("Route rendered successfully");
}

// ================= INIT =================
window.onload = ()=>{
    initMap();

    // AUTO SET TODAY DATE
    document.getElementById("dateInput").value =
        new Date().toISOString().split('T')[0];
};

</script>

</body>
</html>
