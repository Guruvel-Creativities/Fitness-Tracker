<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Tracker - Route Map | Coimbatore</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 30px; }
        .location-badge {
            background: rgba(255,255,255,0.2);
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            margin-top: 10px;
        }
        .controls {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .stat-card h3 { font-size: 0.8em; color: #667eea; text-transform: uppercase; }
        .stat-card .value { font-size: 1.5em; font-weight: bold; }
        #map { height: 500px; border-radius: 10px; margin-bottom: 20px; z-index: 1; }
        .data-table {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; color: #667eea; }
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            color: white;
            flex-direction: column;
        }
    </style>
</head>
<body>

    <div class="loading-overlay" id="loader">
        <div style="font-size: 2em;">🛰️ Fetching GPS Data...</div>
    </div>

    <div class="container">
        <div class="header">
            <h1>🏃 Fitness Tracker Route</h1>
            <div class="location-badge">📍 Coimbatore, Tamil Nadu</div>
        </div>

        <div class="controls">
            <label>📅 Date:</label>
            <input type="date" id="dateInput">
            <button onclick="loadData()" style="padding: 8px 15px; cursor: pointer;">🗺️ Load Route</button>
            <button onclick="exportGeoJSON()" style="padding: 8px 15px; cursor: pointer;">📥 Export</button>
        </div>

        <div class="stats">
            <div class="stat-card"><h3>Distance</h3><div class="value" id="distVal">0.00 km</div></div>
            <div class="stat-card"><h3>Max Speed</h3><div class="value" id="speedVal">0.0 km/h</div></div>
            <div class="stat-card"><h3>Points</h3><div class="value" id="pointVal">0</div></div>
        </div>

        <div id="map"></div>

        <div class="data-table">
            <table>
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Lat</th>
                        <th>Long</th>
                        <th>Distance (km)</th>
                        <th>Speed</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        // CONFIGURATION
        const SHEET_ID = '2PACX-1vTWm5aTQ5LCqkYJXMrengrw0ES1RdeT-TurNXTWVejFFmK9rSmt0ekKCY_DnLOS3wDegMU9OOs3w5gc';
        const GID = '86938637';
        const CSV_URL = `https://docs.google.com/spreadsheets/d/e/${SHEET_ID}/pub?gid=${GID}&single=true&output=csv`;

        let map, routeLayer, startMarker, endMarker;
        let globalData = [];

        function initMap() {
            // Centered on Coimbatore coordinates from your data
            map = L.map('map').setView([11.0168, 76.9558], 14);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
        }

        async function loadData() {
            const selectedDate = document.getElementById('dateInput').value;
            const loader = document.getElementById('loader');
            loader.style.display = 'flex';

            try {
                const response = await fetch(CSV_URL);
                const csvText = await response.text();
                
                Papa.parse(csvText, {
                    header: true,
                    dynamicTyping: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        processResults(results.data, selectedDate);
                        loader.style.display = 'none';
                    }
                });
            } catch (error) {
                alert("Error fetching data. Check internet and Sheet visibility.");
                loader.style.display = 'none';
            }
        }

        function processResults(data, filterDate) {
            // Flexible column detection
            const latKey = Object.keys(data[0]).find(k => k.toLowerCase().includes('lat'));
            const lonKey = Object.keys(data[0]).find(k => k.toLowerCase().includes('lon') || k.toLowerCase().includes('lng'));
            const dateKey = Object.keys(data[0]).find(k => k.toLowerCase().includes('date'));

            const filtered = data.filter(row => {
                const rowDate = row[dateKey]?.toString().split(' ')[0];
                return rowDate === filterDate;
            });

            if (filtered.length === 0) {
                alert("No data found for this date.");
                return;
            }

            globalData = filtered;
            updateUI(filtered, latKey, lonKey);
        }

        function updateUI(data, latKey, lonKey) {
            const points = [];
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';
            
            let maxSpeed = 0;

            data.forEach(row => {
                const lat = parseFloat(row[latKey]);
                const lon = parseFloat(row[lonKey]);

                // Validate coordinates are within India/Coimbatore range to avoid [0,0] jumps
                if (!isNaN(lat) && !isNaN(lon) && lat > 8 && lat < 38) {
                    points.push([lat, lon]);
                    
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${row.Time || 'N/A'}</td><td>${lat.toFixed(4)}</td><td>${lon.toFixed(4)}</td><td>${row['Distance (km)'] || 0}</td><td>${row['Speed (km/h)'] || 0}</td>`;
                    tableBody.appendChild(tr);

                    if (row['Speed (km/h)'] > maxSpeed) maxSpeed = row['Speed (km/h)'];
                }
            });

            // Update Stats
            document.getElementById('distVal').innerText = (data[data.length-1]['Distance (km)'] || 0).toFixed(2) + " km";
            document.getElementById('speedVal').innerText = maxSpeed.toFixed(1) + " km/h";
            document.getElementById('pointVal').innerText = points.length;

            // Update Map
            if (routeLayer) map.removeLayer(routeLayer);
            if (startMarker) map.removeLayer(startMarker);
            if (endMarker) map.removeLayer(endMarker);

            if (points.length > 0) {
                routeLayer = L.polyline(points, { color: '#667eea', weight: 5 }).addTo(map);
                startMarker = L.marker(points[0]).addTo(map).bindPopup("Start");
                endMarker = L.marker(points[points.length-1]).addTo(map).bindPopup("End");
                map.fitBounds(routeLayer.getBounds(), { padding: [40, 40] });
            }
        }

        function exportGeoJSON() {
            if (globalData.length === 0) return alert("Load data first");
            const geojson = {
                type: "FeatureCollection",
                features: [{
                    type: "Feature",
                    geometry: { type: "LineString", coordinates: globalData.map(r => [r.Longitude, r.Latitude]) },
                    properties: { date: document.getElementById('dateInput').value }
                }]
            };
            const blob = new Blob([JSON.stringify(geojson)], {type: "application/json"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `route_${document.getElementById('dateInput').value}.geojson`;
            a.click();
        }

        window.onload = () => {
            initMap();
            // Default to today
            document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];
        };
    </script>
</body>
</html>
