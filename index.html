<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitness Tracker</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
body { font-family: Arial; background:#f5f5f5; }
.container { max-width:1200px; margin:auto; }
#map { height:500px; margin-top:20px; border-radius:10px; }
#debug { background:#111; color:#0f0; padding:10px; height:150px; overflow:auto; font-size:12px;}
button { padding:10px; margin:5px; }
</style>
</head>

<body>

<div class="container">
<h2>Fitness Tracker</h2>

<input type="date" id="dateInput">
<button onclick="fetchSheetData()">Load Route</button>

<div id="map"></div>
<div id="debug">> Ready...<br></div>
</div>

<script>
// ================= SETTINGS =================
const SHEET_ID = '2PACX-1vTWm5aTQ5LCqkYJXMrengrw0ES1RdeT-TurNXTWVejFFmK9rSmt0ekKCY_DnLOS3wDegMU9OOs3w5gc';
const GID = '86938637';
const CSV_URL = `https://docs.google.com/spreadsheets/d/e/${SHEET_ID}/pub?gid=${GID}&single=true&output=csv&t=${Date.now()}`;

// ================= GLOBAL =================
let map, routeLine, startMarker, endMarker;

// ================= LOGGER =================
function log(msg){
    const d = document.getElementById("debug");
    d.innerHTML += "> " + msg + "<br>";
    d.scrollTop = d.scrollHeight;
    console.log(msg);
}

// ================= MAP =================
function initMap(){
    map = L.map('map').setView([11.0168, 76.9558], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
        attribution:'© OpenStreetMap'
    }).addTo(map);
}

// ================= FETCH =================
async function fetchSheetData(){

    const filterDate = document.getElementById("dateInput").value;
    if(!filterDate){
        alert("Select date");
        return;
    }

    log("Fetching CSV...");

    try{
        const res = await fetch(CSV_URL);
        if(!res.ok) throw new Error("Sheet not accessible");

        const text = await res.text();

        Papa.parse(text,{
            header:true,
            skipEmptyLines:true,
            complete:(result)=>{
                processData(result.data, filterDate);
            }
        });

    }catch(e){
        log("ERROR: "+e.message);
    }
}

// ================= PROCESS =================
function processData(data, filterDate){

    if(!data || data.length === 0){
        log("No data found");
        return;
    }

    log("Total rows: " + data.length);
    log("Columns: " + Object.keys(data[0]).join(", "));

    // AUTO DETECT
    const findCol = (regex) =>
        Object.keys(data[0]).find(k => regex.test(k)) || null;

    let latKey = findCol(/lat/i);
    let lonKey = findCol(/lon|lng/i);
    let dateKey = findCol(/date/i);
    let timeKey = findCol(/time/i);

    // FALLBACK (edit if needed)
    latKey = latKey || "Latitude";
    lonKey = lonKey || "Longitude";
    dateKey = dateKey || "Date";

    log(`Using: ${latKey}, ${lonKey}, ${dateKey}`);

    // FILTER DATE
    const filtered = data.filter(row=>{
        const raw = row[dateKey];
        if(!raw) return false;

        const d = new Date(raw);
        if(isNaN(d)) return false;

        const formatted = d.toISOString().split('T')[0];
        return formatted === filterDate;
    });

    log("Filtered rows: " + filtered.length);

    if(filtered.length === 0){
        alert("No data for selected date");
        return;
    }

    renderRoute(filtered, latKey, lonKey, timeKey);
}

// ================= RENDER =================
function renderRoute(data, latK, lonK, timeK){

    let points = [];

    data.forEach(row=>{
        const lat = parseFloat(String(row[latK]).trim());
        const lon = parseFloat(String(row[lonK]).trim());

        if(!isNaN(lat) && !isNaN(lon)){
            if(lat > 8 && lat < 38){ // India filter
                points.push([lat, lon]);
            }
        }
    });

    log("Valid points: " + points.length);

    // CLEAR OLD
    if(routeLine) map.removeLayer(routeLine);
    if(startMarker) map.removeLayer(startMarker);
    if(endMarker) map.removeLayer(endMarker);

    if(points.length === 0){
        log("No valid GPS points");
        return;
    }

    routeLine = L.polyline(points,{color:"blue", weight:5}).addTo(map);

    startMarker = L.marker(points[0]).addTo(map).bindPopup("Start");
    endMarker = L.marker(points[points.length-1]).addTo(map).bindPopup("End");

    map.fitBounds(routeLine.getBounds(), {padding:[50,50]});

    setTimeout(()=>map.invalidateSize(),500);

    log("Route rendered successfully");
}

// ================= INIT =================
window.onload = ()=>{
    initMap();
    document.getElementById("dateInput").value =
        new Date().toISOString().split('T')[0];
};

</script>

</body>
</html>
